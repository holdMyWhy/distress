  localStorage.setItem(BUYERS_KEY, JSON.stringify(data));

    saveAllBuyers(allBuyers);

}

function fmtShort(n, c) {
  if (!n) return '-';
  const v = c === 'USD' ? n * 0.2723 : n;
  const p = c === 'USD' ? '$' : '';
  if (v >= 1e6) return p + (v/1e6).toFixed(1) + 'M';
  if (v >= 1e3) return p + (v/1e3).toFixed(0) + 'K';
  return p + v.toLocaleString();
}

function getDeals() {
  const all = loadAllDeals();
  if (state.selectedDate === 'all') {
    const merged = [];
    const seen = new Set();
    Object.entries(all).sort((a,b) => b[0].localeCompare(a[0])).forEach(([date, deals]) => {
      deals.forEach(d => {
        const key = `${d.community}|${d.title}|${d.price}`;
        if (!seen.has(key)) { seen.add(key); merged.push({...d, date}); }
      });
    });
    return merged;
  }
  return (all[state.selectedDate] || []).map(d => ({...d, date: state.selectedDate}));
}

function getBuyers() {
  const all = loadAllBuyers();
  if (state.selectedDate === 'all') {
    const merged = [];
    Object.values(all).forEach(b => merged.push(...b));
    return merged;
  }
  return all[state.selectedDate] || [];
}

var leafletMap = null;
var leafletMarkers = [];


function updateMapFiltersOnly() {
  // Rebuild just the filter bar without touching the rest of the page
  var allDeals = getDeals();
  var buyers = getBuyers();
  renderMapFilters(allDeals, buyers);
  // Re-attach placeholder height
  var ph = document.getElementById("mapPlaceholder");
  if (ph && state.showMap) ph.style.height = "520px";
  setTimeout(positionAndInitMap, 50);
}

function toggleLeafletMap() {
  state.showMap = !state.showMap;
  render();
  if (state.showMap) {
    setTimeout(positionAndInitMap, 150);
  } else {
    var wrap = document.getElementById('leafletMapWrap');
    if (wrap) {
      wrap.style.display = 'none';
      document.body.appendChild(wrap);
    }
    // Keep leaflet alive, just hidden
  }
}

function positionAndInitMap() {
  var placeholder = document.getElementById('mapPlaceholder');
  var wrap = document.getElementById('leafletMapWrap');
  if (!placeholder || !wrap) return;
  
  // Move the map container into the placeholder's position in the DOM
  if (wrap.parentNode !== placeholder) {
    placeholder.innerHTML = '';
    placeholder.appendChild(wrap);
  }
  wrap.style.display = 'block';
  wrap.style.position = 'relative';
  wrap.style.width = '100%';
  wrap.style.zIndex = '1';
  wrap.style.pointerEvents = 'auto';
  wrap.style.marginBottom = '16px';
  
  // Remove fixed placeholder height since map is now inside it
  placeholder.style.height = 'auto';
  
  // Init leaflet if needed
  if (!leafletMap && typeof L !== 'undefined') {
    leafletMap = L.map('leafletMap', {zoomControl: true}).setView([25.13, 55.23], 11);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {maxZoom: 18}).addTo(leafletMap);
  }
  if (leafletMap) {
    leafletMap.invalidateSize();
    updateLeafletMap();
  }
}

function initAndUpdateMap() {
  if (state.showMap) positionAndInitMap();
}

function updateLeafletMap() {
  if (!leafletMap) return;
  
  var allDeals = getDeals();
  var filtered = allDeals.filter(function(d){ return d.urgency !== "sold" && d.price; });
  
  var beds = state.mapBeds || "all";
  if (beds !== "all") {
    if (beds === "5+") filtered = filtered.filter(function(d){return d.beds && d.beds >= 5});
    else filtered = filtered.filter(function(d){return d.beds === parseInt(beds)});
  }
  var maxP = state.mapMaxPrice || 999999999;
  filtered = filtered.filter(function(d){return d.price <= maxP});
  var tp = state.mapType || "All";
  if (tp !== "All") {
    if (tp === "Studio") filtered = filtered.filter(function(d){return d.beds === 0});
    else filtered = filtered.filter(function(d){return d.type === tp});
  }
  
  var groups = {};
  for (var i=0;i<filtered.length;i++) {
    var c = filtered[i].community;
    if (!groups[c]) groups[c] = [];
    groups[c].push(filtered[i]);
  }
  
  // Clear old markers
  for (var m=0;m<leafletMarkers.length;m++) leafletMap.removeLayer(leafletMarkers[m]);
  leafletMarkers = [];
  
  var keys = Object.keys(groups);
  for (var k=0;k<keys.length;k++) {
    var comm = keys[k];
    var items = groups[comm];
    var coords = COORDS[comm];
    if (!coords) continue;
    
    // Use simple circle markers instead of heavy divIcon HTML
    var r = Math.max(8, Math.min(22, 5 + items.length * 2));
    var marker = L.circleMarker(coords, {
      radius: r,
      fillColor: '#00FF88',
      fillOpacity: 0.25,
      color: '#00FF88',
      weight: 1.5,
      opacity: 0.8
    }).addTo(leafletMap);
    
    // Tooltip (lightweight, no popup DOM)
    var minPr = items[0].price, maxPr = items[0].price;
    for (var j=1;j<items.length;j++) {
      if (items[j].price < minPr) minPr = items[j].price;
      if (items[j].price > maxPr) maxPr = items[j].price;
    }
    var tip = comm + ' (' + items.length + ')\n' + fmtShort(minPr,'AED');
    if (items.length > 1) tip += ' - ' + fmtShort(maxPr,'AED');
    marker.bindTooltip(tip, {permanent: items.length >= 5, direction: 'top', className: 'map-tip', offset: [0, -r]});
    
    // Click to filter
    marker.on('click', (function(c) {
      return function() { state.communityFilter = c; state.showMap = false; toggleLeafletMap(); render(); };
    })(comm));
    
    leafletMarkers.push(marker);
  }
}

                const waMsg = encodeURIComponent(`Hi Viren, I'm interested in this listing from DataDXB:\n\n${d.title} | ${d.community}${d.price?'\nPrice: AED '+d.price.toLocaleString():''}${d.area&&d.area<100000?'\nSize: '+d.area.toLocaleString()+' sqft':''}${d.discount?'\nDiscount: '+d.discount+'% vs OP':''}\n\nPlease share more details.`);

          <div style="display:flex;gap:8px;margin-bottom:8px">
            <input id="admin-date" type="date" value="" style="padding:6px 12px;border-radius:6px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);color:var(--fg);font-family:var(--mono);font-size:12px" />

            <button class="admin-btn" onclick="state.adminUnlocked=false;state.showAdmin=false;render()" style="background:rgba(255,59,48,.1);color:var(--red)">Lock Admin</button>
            <span id="admin-msg" class="mono" style="font-size:11px;color:var(--green);align-self:center;margin-left:8px"></span>

    <div style="margin-top:32px;padding:24px 28px;border-radius:12px;background:linear-gradient(135deg,rgba(37,211,102,.06),rgba(18,140,126,.06));border:1px solid rgba(37,211,102,.12);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">

        <strong>Disclaimer:</strong> All deals, prices, and property data displayed on this page are sourced from third-party brokers and publicly shared listings. DataDXB and Viren bear no responsibility for the accuracy, completeness, or reliability of this information and shall not be held liable for any words, prices, or descriptions used. This website is for educational and informational purposes only and does not advertise, promote, or endorse any specific property, developer, or transaction. Always conduct your own due diligence before making any investment decision.

</div>

  renderBuyers(buyers);

  }

// ===============================================================
// ADMIN FUNCTIONS
// ===============================================================
function importDeals() {
  const dateEl = document.getElementById('admin-date');
  const jsonEl = document.getElementById('admin-json');
  const msgEl = document.getElementById('admin-msg');
  if (!dateEl.value) { msgEl.textContent = '! Enter a date'; return; }
  try {
    const data = JSON.parse(jsonEl.value);
    if (!Array.isArray(data)) throw new Error('Must be array');
    addDayDeals(dateEl.value, data, []);
    msgEl.textContent = `OK Imported ${data.length} deals for ${dateEl.value}`;
    state.selectedDate = dateEl.value;
    setTimeout(render, 800);
  } catch(e) {
    msgEl.textContent = '! Invalid JSON: ' + e.message;
  }
}

function exportAll() {
  const data = { deals: loadAllDeals(), buyers: loadAllBuyers() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'datadxb-export.json'; a.click();
  URL.revokeObjectURL(url);
}

// Initial render
render();
</script>
